<!DOCTYPE html>
<html lang="en" data-theme-default="auto">
<head>
<meta charset="UTF-8">
<!-- Never disable zoom: patients enlarge text. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Fluid and weight tracker for haemodialysis patients of the SPMC Kidney and Transplant Institute (SKTI), Davao City. Works offline. All data stays on the phone.">
<!-- Matches the page background, not a brand bar — there is no header to blend with. -->
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">
<title>SKTI Patient Profile — Fluid &amp; Weight Tracker</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">

<!-- Progressive enhancement only. The CSS system stack carries the app offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<!-- ===== Icon sprite: Lucide geometry, stroke 2, 24×24. No emoji anywhere. ===== -->
<svg style="display:none;" aria-hidden="true" focusable="false">
  <defs>
    <g id="_s" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="i-droplet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
  </symbol>
  <symbol id="i-scale" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="5" r="3"/>
    <path d="M6.5 8a2 2 0 0 0-1.9 1.46L2.1 18.5A2 2 0 0 0 4 21h16a2 2 0 0 0 1.93-2.54L19.4 9.46A2 2 0 0 0 17.5 8Z"/>

  <symbol id="i-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="4"/>
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>

  <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

  </symbol>

  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

    <path d="M20 6 9 17l-5-5"/>
  </symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>
  </symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

  </symbol>

    <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
  </symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
  </symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18M6 6l12 12"/>
  </symbol>
  <symbol id="i-trending" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-printer" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9V2h12v7"/>
    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
    <rect x="6" y="14" width="12" height="8"/>
  </symbol>
  <symbol id="i-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </symbol>
  <symbol id="i-glass" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 3h10l-1.2 16.2A2 2 0 0 1 13.8 21h-3.6a2 2 0 0 1-2-1.8L7 3z"/><path d="M7.4 9h9.2"/>
  </symbol>
  <symbol id="i-cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5h12v8a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/>
    <path d="M16 7h2a3 3 0 0 1 0 6h-2"/><path d="M3 21h14"/>
  </symbol>
  <symbol id="i-bottle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2h4v3l1.5 2.5A4 4 0 0 1 16 9.6V19a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V9.6a4 4 0 0 1 .5-2.1L10 5z"/>
    <path d="M8 12h8"/>
  </symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 11h18a9 9 0 0 1-9 9 9 9 0 0 1-9-9z"/>
    <path d="M9.5 7.5c0-1 1-1.5 1-2.5s-1-1.5-1-2.5M14 7.5c0-1 1-1.5 1-2.5s-1-1.5-1-2.5"/>
  </symbol>
  <symbol id="i-ice" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="8" width="10" height="10" rx="2"/>
    <path d="M9 8V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2"/>
  </symbol>
  <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
  </symbol>
  <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

  </symbol>
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">

    <path d="M9 3C5.7 3 3 6.1 3 10c0 5.5 4 11 6.5 11 1.6 0 2.2-1.3 2.2-2.7 0-1.6-1.2-2.3-1.2-3.6 0-1.1.9-1.8 2-1.8"/>
    <path d="M15 3c3.3 0 6 3.1 6 7 0 5.5-4 11-6.5 11"/>
  </symbol>
  <symbol id="i-heart-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 14c1.5-1.6 3-3.4 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.7 0-3 .6-4.5 2.5C10.5 3.6 9.2 3 7.5 3A5.5 5.5 0 0 0 2 8.5c0 2.1 1.5 3.9 3 5.5l7 7Z"/>

    <path d="m9 6 6 6-6 6"/>
  </symbol>
  <symbol id="i-pill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round">
    <path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"/><path d="m8.5 8.5 7 7"/>
  </symbol>
</svg>

<div class="shell">

  <!-- Sticky so the gear stays reachable while content scrolls under it,
       same rule the old empty gearbar followed — it just now carries the
       building photo instead of blank page background. -->
  <header class="app-header">
    <img class="app-header__photo" src="assets/skti-building.jpg" alt=""
         onerror="this.remove()">
    <div class="app-header__scrim"></div>
    <div class="app-header__row">
      <span class="app-header__badge">
        <img src="assets/logo.png"
             alt="Department of Health, Republic of the Philippines — Southern Philippines Medical Center seal"
             onerror="this.parentNode.remove()">
      </span>
      <h1 class="app-header__title">
        SKTI Patient Profile
        <span class="app-header__sub">SPMC Kidney &amp; Transplant Institute</span>
      </h1>
      <button type="button" class="app-header__gear" id="btnSettings" aria-label="Settings">
        <svg aria-hidden="true"><use href="#i-settings"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="main" id="main" tabindex="-1">
    <p class="banner" id="offline" hidden>
      <svg aria-hidden="true"><use href="#i-info"/></svg><span></span>
    </p>
    <noscript>
      <p class="banner">This app needs JavaScript to work.</p>
    </noscript>
  </main>

  <!-- ===== Bottom nav: 5 top-level destinations, icon + label ===== -->
  <nav class="nav" aria-label="Main">
    <button type="button" class="nav__item" data-go="today">
      <svg aria-hidden="true"><use href="#i-sun"/></svg><span>Today</span>
    </button>
    <button type="button" class="nav__item" data-go="fluid">
      <svg aria-hidden="true"><use href="#i-droplet"/></svg><span>Fluid</span>
    </button>
    <button type="button" class="nav__item" data-go="weight">
      <svg aria-hidden="true"><use href="#i-scale"/></svg><span>Weight</span>
    </button>
    <button type="button" class="nav__item" data-go="meds">
      <svg aria-hidden="true"><use href="#i-pill"/></svg><span>Meds</span>
    </button>
    <button type="button" class="nav__item" data-go="session">
      <svg aria-hidden="true"><use href="#i-activity"/></svg><span>Dialysis</span>
    </button>
  </nav>
</div>

<div class="toast-wrap" id="toasts" aria-live="polite" aria-atomic="false"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
