name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync web assets into native project
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Point Gradle at the runner's Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SKTIDVO-debug.apk

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: apk-build-${{ github.run_number }}
          name: SKTIDVO APK build ${{ github.run_number }}
          artifacts: SKTIDVO-debug.apk
          body: Auto-built debug APK from commit ${{ github.sha }}. Bundled offline app, no live hosting required.
          token: ${{ secrets.GITHUB_TOKEN }}
